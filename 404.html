<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>법화삼부경과 연뿌리 이야기 · Lotus Root &amp; Sutra</title>
    <script>
      (function () {
        // 도메인 루트(example.com)면 0, 하위 폴더(example.com/Cat-Sutra)면 1
        var pathSegmentsToKeep = 0;
        var loc = window.location;
        var parts = loc.pathname.split("/").filter(Boolean);
        var keep = parts.slice(0, pathSegmentsToKeep).join("/");
        var rest = parts.slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~");
        var search = loc.search.slice(1).replace(/&/g, "~and~");
        loc.replace(
          loc.protocol +
            "//" +
            loc.host +
            (keep ? "/" + keep : "") +
            "/?/" +
            rest +
            (search ? "&" + search : "") +
            loc.hash
        );
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body>
    <p><a href="/">법화삼부경으로 돌아가기</a></p>
  </body>
</html>
