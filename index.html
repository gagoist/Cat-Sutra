    <script>
      (function () {
        var SLUGS = {
          journey: 1,
          mind: 1,
          "journey-of-the-mind": 1,
          "beginning-this-journey": 1,
          beginning: 1,
          "how-this-journey-began": 1,
          "roots-of-compassion": 1,
          roots: 1,
          "story-of-myohyeonsa": 1,
          myohyeonsa: 1,
          "encountering-the-lotus-sutra": 1,
          "encountering-lotus": 1,
          muryangui: 1,
          lotus: 1,
          fugen: 1,
          opening: 1,
          "opening-sutra": 1,
          "lotus-sutra": 1,
          main: 1,
          closing: 1,
          "closing-sutra": 1,
        };

        function stripRoute(pathname) {
          var path = String(pathname || "").replace(/\/index\.html$/i, "");
          var segs = path.split("/").filter(Boolean);
          if (segs.length && /^\d+(?:page)?$/i.test(segs[segs.length - 1])) segs.pop();
          if (segs.length && /^chapter-?\d+$/i.test(segs[segs.length - 1])) segs.pop();
          while (segs.length && SLUGS[String(segs[segs.length - 1]).toLowerCase()]) segs.pop();
          return segs.length ? "/" + segs.join("/") + "/" : "/";
        }

        function ensureSlash(path) {
          if (!path || path === "/") return "/";
          return path.slice(-1) === "/" ? path : path + "/";
        }

        var basePath;
        if (String(location.search || "").indexOf("?/") === 0) {
          var raw = location.search.slice(2).replace(/~and~/g, "&");
          var qAt = raw.indexOf("&");
          var routePath = "/" + (qAt < 0 ? raw : raw.slice(0, qAt)).replace(/^\/+/, "");
          var extraQ = qAt < 0 ? "" : "?" + raw.slice(qAt + 1);
          basePath = ensureSlash(location.pathname.replace(/\/index\.html$/i, "") || "/");
          if (basePath !== "/" && routePath.indexOf(basePath) !== 0) {
            routePath = basePath.replace(/\/$/, "") + routePath;
          }
          try {
            history.replaceState(null, "", routePath + extraQ + location.hash);
          } catch (err) {}
        } else {
          basePath = stripRoute(location.pathname);
        }

        if (location.protocol === "file:") return;

        var base = document.createElement("base");
        base.href = location.origin + basePath;
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
